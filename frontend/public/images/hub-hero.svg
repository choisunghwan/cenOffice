  <!-- 차트 카드: 활용 현황 -->
  <g filter="url(#shadow)"><rect x="352" y="228" width="266" height="168" rx="20" fill="#fff"/></g>
  <rect x="376" y="252" width="84" height="10" rx="5" fill="#d7e4f6"/>
