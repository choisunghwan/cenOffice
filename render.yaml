# Render Blueprint: Render 대시보드 > New > Blueprint 에서 이 저장소를 고르면 아래가 한 번에 만들어집니다.
# 안내: deploy/render/README.md
# 화상 회의 서버(LiveKit)는 Render 에서 돌릴 수 없어(UDP 필요) LiveKit Cloud 를 씁니다.

# DB 는 Supabase(PostgreSQL)를 씁니다. 무료이고 기간 제한이 없습니다 (Render 무료 DB 는 30일 뒤 지워짐).

services:
  - type: web
    name: cenhub        # 주소: https://cenhub.onrender.com (이미 쓰인 이름이면 뒤에 임의 문자가 붙습니다)
    runtime: docker
    dockerfilePath: ./deploy/render/Dockerfile
    dockerContext: .
    plan: free          # 무료는 15분간 접속이 없으면 잠듭니다. 회의 중 끊기지 않으려면 starter 이상
    region: singapore
    healthCheckPath: /
    autoDeploy: true
    envVars:
      # Supabase > Connect > Session pooler 값 (Render 는 IPv4 만 되므로 Direct connection 이 아닌 Session pooler)
      - key: DB_URL               # 예: jdbc:postgresql://aws-0-ap-southeast-1.pooler.supabase.com:5432/postgres?sslmode=require
        sync: false
      - key: DB_USER              # 예: postgres.<프로젝트 ref>
        sync: false
      - key: DB_PASSWORD          # Supabase 프로젝트를 만들 때 정한 DB 비밀번호
        sync: false
      # Supabase 무료 Session pooler 는 동시 연결 수가 적어 연결 풀을 작게 둔다
      - key: SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE
        value: "5"
      - key: JWT_SECRET
        generateValue: true
      # 처음 생성되는 계정 비밀번호: Render 가 임의로 만들고, 대시보드 Environment 에서 볼 수 있습니다
      - key: OFFICE_ADMIN_PASSWORD
        generateValue: true
      - key: OFFICE_USER_PASSWORD
        generateValue: true
      # 화상 회의: LiveKit Cloud 프로젝트 값 (만들 때 입력, 비워 두면 회의 화상 기능만 꺼짐)
      - key: LIVEKIT_URL          # 예: wss://cenhub-xxxx.livekit.cloud
        sync: false
      - key: LIVEKIT_API_URL      # 예: https://cenhub-xxxx.livekit.cloud
        sync: false
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false
      # 선택: AI · 메일
      # LLM_PROVIDER 를 gemini / anthropic / openai 로 바꾸고 해당 키를 넣어야 AI 가 연결됩니다(mock = AI 없이 규칙만)
      - key: LLM_PROVIDER
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: EXT_ALLOWED_ORIGINS
        sync: false
