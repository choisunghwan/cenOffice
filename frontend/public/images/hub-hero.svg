<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 480" fill="none" role="img" aria-hidden="true">
  <defs>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a3fbf"/>
      <stop offset="1" stop-color="#58a3ff"/>
    </linearGradient>
    <linearGradient id="halo" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#d3e5ff"/>
      <stop offset="1" stop-color="#f5faff"/>
    </linearGradient>
    <linearGradient id="chatBlue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1a62d6"/>
      <stop offset="1" stop-color="#3f8bff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="13" flood-color="#1c4a96" flood-opacity=".2"/>
    </filter>
  </defs>

  <!-- 배경: 부드러운 원 + 아이티센 심볼을 연상시키는 사분원 -->
