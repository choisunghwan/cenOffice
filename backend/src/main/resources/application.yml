# 모든 비밀값은 환경변수로 주입합니다. (README 참고)
spring:
  application:
    name: cen-office-backend
  datasource:
    # 기본값: 로컬 개발용 파일 H2(PostgreSQL 호환 모드). 운영/실사용은 DB_URL로 PostgreSQL 지정.
    url: ${DB_URL:jdbc:h2:file:./data/cenoffice;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
  flyway:
    # 기존(Hibernate 가 만든) DB 는 V1 기준선으로 간주하고 이후 V2~ 만 적용한다. 기존 테이블/데이터는 변경하지 않는다.
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
    locations: classpath:db/migration
  mail:
    # 이메일 알림(SMTP). host 가 비어 있으면 기능이 꺼지고 화면 알림만 동작한다. 계정 정보는 환경변수로만 주입(저장소에 두지 않음).
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_AUTH:true}
      mail.smtp.starttls.enable: ${MAIL_STARTTLS:true}   # 587 포트(STARTTLS)
      mail.smtp.ssl.enable: ${MAIL_SSL:false}            # 465 포트(SSL)를 쓸 때 true
      mail.smtp.connectiontimeout: 10000
      mail.smtp.timeout: 15000
      mail.smtp.writetimeout: 15000
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      # hub_* 테이블은 Flyway 만 관리한다 (Hibernate update 가 컬럼을 되돌리는 것을 방지)
      hibernate.hbm2ddl.schema_filter_provider: com.cenoffice.config.FlywayOwnedTablesFilterProvider
    open-in-view: false
  jackson:
    default-property-inclusion: non_null

server:
  port: ${PORT:8080}
  address: ${SERVER_ADDRESS:127.0.0.1}   # 기본은 이 PC 에서만 접속 가능. 외부 공개가 필요할 때만 변경

app:
  jwt:
    secret: ${JWT_SECRET:}          # 32자 이상. 비우면 기동 시 임의 생성(재시작하면 로그인 만료)
    ttl-minutes: ${JWT_TTL_MINUTES:480}
  seed:
    admin-password: ${OFFICE_ADMIN_PASSWORD:}   # 비우면 임의 생성 후 로그에 1회 출력
    user-password: ${OFFICE_USER_PASSWORD:}
    sync-passwords: ${OFFICE_SYNC_PASSWORDS:false}   # 개발용: true 면 기존 계정 비밀번호를 위 값으로 갱신
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5180,http://localhost:5173}
  devices:
    command-timeout-seconds: ${DEVICE_COMMAND_TIMEOUT_SECONDS:10}
    mock:
      min-latency-ms: ${MOCK_MIN_LATENCY_MS:300}
      max-latency-ms: ${MOCK_MAX_LATENCY_MS:900}
      failure-rate: ${MOCK_FAILURE_RATE:0.0}   # 0~1, 실패 처리 테스트용
  llm:
    provider: ${LLM_PROVIDER:mock}            # mock | anthropic | openai | gemini
    api-key: ${ANTHROPIC_API_KEY:}            # provider=anthropic 일 때만 사용. 코드/DB 에 저장하지 않음
    model: ${LLM_MODEL:claude-sonnet-5-5}
    openai-api-key: ${OPENAI_API_KEY:}        # provider=openai 일 때만 사용. 코드/DB 에 저장하지 않음
    openai-model: ${OPENAI_MODEL:gpt-4o-mini}
    gemini-api-key: ${GEMINI_API_KEY:}        # provider=gemini 일 때만 사용. 코드/DB 에 저장하지 않음
    gemini-model: ${GEMINI_MODEL:gemini-2.5-flash}
  env: ${APP_ENV:DEV}                          # DEV | STG | PROD. PROD 에서는 Mock 런타임을 사용할 수 없다
  mail:
    enabled: ${MAIL_ENABLED:true}
    from: ${MAIL_FROM:}                               # 비우면 SMTP 계정(MAIL_USERNAME) 주소 사용
    base-url: ${APP_BASE_URL:http://localhost:5180}   # 메일 안의 링크가 가리킬 CEN OFFICE 주소
  hub:
    ai-engine: ${HUB_AI_ENGINE:false}          # true: 승인된 Skill 을 LLM(app.llm.*)으로 실행. 입력이 해당 LLM 서비스로 전송됨
    runtime: ${HUB_RUNTIME:none}               # none | mock | llm  (기본: 실행 런타임 없음 = 실행 연동 준비 중)
